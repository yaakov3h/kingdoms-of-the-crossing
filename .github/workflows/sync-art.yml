      - name: Commit art
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add public/art
          git commit -m "Add art assets (verified by SHA-256 against audited build)" || echo "nothing to commit"
          git push
